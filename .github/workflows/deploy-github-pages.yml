name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Actualiza titulares y redeploy cada hora
    - cron: "0 * * * *"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar titulares (RSS → JSON)
        run: npm run sync:headlines

      - name: Preparar export estático (sin API, login ni proxy)
        run: rm -rf src/app/api src/app/login src/proxy.ts

      - name: Build estático
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /more-news

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
